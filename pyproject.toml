[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-qkd"
version = "2.0.0"
description = "Machine-learning eavesdropping detection and an adaptive defence policy for BB84 quantum key distribution."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Saksham Garg" }]
requires-python = ">=3.10"
keywords = ["quantum key distribution", "BB84", "qiskit", "machine learning", "cybersecurity"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.50", "altair>=5"]
quantum = ["qiskit>=1.0", "qiskit-aer>=0.14"]
lstm = ["torch>=2.1"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10", "pandas-stubs"]

[project.scripts]
adaptive-qkd = "adaptive_qkd.cli:main"

[project.urls]
Repository = "https://github.com/sakshamg251206/Adaptive_QKD"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adaptive_qkd = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning:qiskit.*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF"]
ignore = ["N803", "N806"]  # X_train / X_test follow ML naming conventions

[tool.mypy]
python_version = "3.10"
files = ["src", "dashboard"]
strict = true
# numpy, pandas and altair return loosely typed values throughout numeric code.
warn_return_any = false
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib", "qiskit.*", "qiskit_aer.*", "altair", "torch.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["adaptive_qkd"]
